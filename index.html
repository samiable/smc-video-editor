<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SMC Video Editor</title>
<style>
:root{--bg0:#0E0F12;--bg1:#17191d;--bg2:#121316;--bg3:#24272d;--ln:#2a2d33;--ln2:#33373f;--tx:#E6E8EB;--mu:#9AA0A8;--ac:#4C9AFF;--acx:#0B1220}
[data-theme=light]{--bg0:#F3F4F6;--bg1:#fff;--bg2:#ECEEF1;--bg3:#EEF0F3;--ln:#DDE0E5;--ln2:#C9CDD4;--tx:#1B1D21;--mu:#5B616B}
[data-theme=black]{--bg0:#000;--bg1:#0a0a0a;--bg2:#050505;--bg3:#161616}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:13px Inter,Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;font-size:12px;color:var(--tx);background:var(--bg3);border:1px solid var(--ln2);border-radius:7px;cursor:pointer;padding:0 10px;height:28px}
button:disabled{opacity:.4}
.pr,.on{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acx)!important;font-weight:700}
.mu{color:var(--mu);font-size:11px}
#top{height:40px;background:var(--bg1);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 8px;flex:none;gap:2px;position:relative}
.logo{display:flex;align-items:center;gap:7px;margin:0 12px 0 6px;font-weight:800;white-space:nowrap}
.logo b{background:var(--ac);color:var(--acx);border-radius:6px;padding:3px 6px;font-size:11px}
.mn{border:0;background:transparent;height:40px;border-radius:0;padding:0 11px}
.menu{position:absolute;top:40px;background:var(--bg1);border:1px solid var(--ln2);border-radius:8px;padding:4px 0;min-width:200px;z-index:50;box-shadow:0 8px 24px #0008}
.menu div{padding:8px 14px;display:flex;justify-content:space-between;gap:20px}
.menu div:active{background:var(--bg3)}
#pname{flex:1;text-align:center;font-weight:600}
.chip{border:1px solid var(--ln2);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--mu);white-space:nowrap;margin-left:8px}
#mid{flex:1;min-height:0;display:flex}
#bin{width:200px;background:var(--bg1);border-right:1px solid var(--ln);padding:10px;overflow:auto;flex:none}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.th{height:50px;border-radius:6px;position:relative;background:var(--bg3) center/cover;overflow:hidden}
.th span{position:absolute;right:3px;bottom:2px;font-size:10px;background:#000b;color:#fff;padding:1px 4px;border-radius:3px}
.th i{position:absolute;left:4px;top:2px;font-size:9px;font-style:normal;background:#000b;color:#fff;padding:0 4px;border-radius:3px;max-width:70px;overflow:hidden;white-space:nowrap}
#center{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:8px 8px 0;gap:8px}
#pvwrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
#cv{width:100%;height:100%;object-fit:contain;border-radius:6px;background:#000}
#ctl{width:100%;display:flex;align-items:center;justify-content:space-between;height:34px;flex:none;gap:8px;flex-wrap:nowrap}
.sg{display:flex;border:1px solid var(--ln2);border-radius:7px;overflow:hidden}
.sg button{border:0;border-radius:0;background:transparent;height:24px;padding:0 8px}
#panel{width:280px;background:var(--bg1);border-left:1px solid var(--ln);padding:10px 12px;overflow:auto;flex:none}
.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button{flex:1;padding:0;height:26px;font-size:11px}
.sl{margin-bottom:11px}.sh{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;height:18px}
.sv{display:flex;align-items:center;gap:6px}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--ac)}
.dm{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--mu);margin:0 2px;padding:0;border-radius:2px;background:transparent;flex:none}
.dm.on{background:#FFD166!important;border-color:#FFD166!important}
.ch{display:flex;flex-wrap:wrap;gap:4px}.ch button{height:24px;padding:0 8px;font-size:11px}
select,textarea,input[type=text],input[type=number]{background:var(--bg2);color:var(--tx);border:1px solid var(--ln2);border-radius:7px;padding:5px 8px;font:inherit;font-size:12px}
#tbar{height:34px;background:var(--bg1);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:center;gap:2px;flex:none;overflow-x:auto}
#tbar button{display:flex;align-items:center;gap:4px;height:26px;padding:0 7px;font-size:11px;white-space:nowrap}
.sep{width:1px;height:18px;background:var(--ln2);margin:0 3px;flex:none}
#tl{height:var(--tlh,380px);background:var(--bg2);display:flex;flex-direction:column;flex:none;min-height:140px}
#tlh{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--ln);flex:none;gap:8px}
#grip{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:10px;padding:4px 14px;touch-action:none;cursor:ns-resize}
#tlb{flex:1;overflow:auto;position:relative}
#tlc{position:relative;min-height:100%}
.tr{display:flex;position:relative}
.lb{width:96px;flex:none;position:sticky;left:0;z-index:6;background:var(--bg2);font-size:11px;color:var(--mu);display:flex;align-items:center;gap:5px;padding-left:10px;border-bottom:1px solid var(--ln)}
.lb button{border:0;background:transparent;padding:0;height:16px;width:14px;color:var(--mu)}
.lb button.s{color:#FFD166}
.row{position:relative;background:var(--bg1);border-bottom:1px solid var(--ln);touch-action:pan-x pan-y}
.rul{height:22px;background:var(--bg2);touch-action:none;position:relative}
.rul i{position:absolute;top:5px;font-size:10px;font-style:normal;color:var(--mu);border-left:1px solid var(--ln2);padding-left:4px;height:14px}
.c{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:10px;padding:4px 6px;color:#fff;overflow:hidden;white-space:nowrap;touch-action:none}
.c.sel{outline:2px solid #fff;outline-offset:-2px}
.tk-V1{background:#3A5F8F}.tk-V2,.tk-V3,.tk-V4{background:#6A4C93}.tk-T{background:#8A6A12}.tk-A1{background:#2E7D5B}.tk-A2{background:#2B6F7A}
.h{position:absolute;top:0;bottom:0;width:14px;touch-action:none}.h.l{left:0}.h.r{right:0}
.h::after{content:"";position:absolute;top:30%;bottom:30%;width:3px;border-radius:2px;background:#fff9}.h.l::after{left:3px}.h.r::after{right:3px}
.kfd{position:absolute;width:8px;height:8px;background:#FFD166;transform:rotate(45deg);top:50%;margin-top:-4px;pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#FF8A3D;z-index:5;pointer-events:none}
#ph::before{content:"";position:absolute;left:-5px;top:0;width:12px;height:14px;background:#FF8A3D;border-radius:2px}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:#000b;z-index:100;display:flex;align-items:center;justify-content:center}
.card{background:var(--bg1);border:1px solid var(--ln2);border-radius:12px;padding:16px 18px;max-width:96vw;max-height:94vh;display:flex;flex-direction:column}
.ct{font-size:15px;font-weight:700;margin-bottom:12px}.cb{flex:1;overflow:auto}
.cf{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.cf button{height:30px;padding:0 16px}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tg{width:32px;height:18px;border-radius:9px;background:var(--ln2);position:relative;flex:none;padding:0;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:6px;background:#fff}
.tg.on{background:var(--ac)!important}.tg.on::after{left:17px}
.bar{height:8px;background:var(--ln2);border-radius:4px;overflow:hidden}.bar div{height:8px;background:var(--ac)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--ln2);padding:9px 16px;border-radius:9px;z-index:200;display:none;max-width:80vw}
.ctx{position:fixed;background:var(--bg1);border:1px solid var(--ln2);border-radius:8px;padding:4px 0;z-index:60;box-shadow:0 8px 24px #0008}
.ctx div{padding:9px 16px}
</style>
</head>
<body>
<div id="app">
<div id="top"></div>
<div id="mid">
 <div id="bin"><div style="display:flex;justify-content:space-between;align-items:center"><b>Media</b><button id="imp">Import</button></div><div id="grid"></div><div class="mu" id="binhint" style="margin-top:10px;line-height:1.5">Tap Import to add videos, photos, or audio. Tap an item to put it on the timeline at the marker.</div></div>
 <div id="center"><div id="pvwrap"><canvas id="cv" width="640" height="360"></canvas></div><div id="ctl"></div></div>
 <div id="panel"></div>
</div>
<div id="tbar"></div>
<div id="tl">
 <div id="tlh"></div>
 <div id="tlb"><div id="tlc"></div></div>
</div>
</div>
<div id="toast"></div>
<input type="file" id="fin" multiple accept="video/*,audio/*,image/*" style="display:none">
<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmtT=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60),f=Math.floor((t%1)*30);return[m,s,f].map(n=>String(n).padStart(2,'0')).join(':')};
const ico=(d,s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const IC={undo:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',redo:'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',copy:'M8 8h12v12H8zM4 16V4h12',paste:'M9 4h6v3H9zM7 6H5v15h8M11 10h9v11h-9z',split:'M12 3v18M7 8l-3 4 3 4M17 8l3 4-3 4',cl:'M12 3v18M8 7l-5 5 5 5',cr:'M12 3v18M16 7l5 5-5 5',key:'M12 3l7 9-7 9-7-9z',spd:'M12 14l5-5M4 18a9 9 0 1116 0',txt:'M5 6V4h14v2M12 4v16M9 20h6',del:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',dup:'M8 8h12v12H8zM4 16V4h12',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6',lock:'M6 11h12v9H6zM9 11V8a3 3 0 016 0v3',spk:'M4 9v6h4l5 4V5L8 9z',play:'M7 4l13 8-13 8z',pause:'M7 4v16M17 4v16',prev:'M19 5l-9 7 9 7zM5 5v14',next:'M5 5l9 7-9 7zM19 5v14',gear:'M12 9a3 3 0 100 6 3 3 0 000-6M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',grip:'M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4'};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2800)}
function dlg(title,body,btns,w=520){const o=el('div','ov'),c=el('div','card');c.style.width=w+'px';const cb=el('div','cb');cb.append(body);c.append(el('div','ct',title),cb);const f=el('div','cf');btns.forEach(([t,fn,pr])=>{const b=el('button',pr?'pr':'',t);b.onclick=()=>{if(fn&&fn()===false)return;o.remove()};f.append(b)});c.append(f);o.append(c);document.body.append(o);return o}
function chips(items,cur,fn){const d=el('div','ch');items.forEach(t=>{const b=el('button',t===cur?'on':'',t);b.onclick=()=>{d.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(t)};d.append(b)});return d}
function toggle(on,fn){const b=el('button','tg'+(on?' on':''));b.onclick=()=>{b.classList.toggle('on');fn(b.classList.contains('on'))};return b}
function row(l,r){const d=el('div','dr');d.append(el('span','',l));if(r)d.append(r);return d}

/* ============ settings & theme ============ */
const ACC=['#4C9AFF','#2EC4B6','#2ECC71','#FF8A3D','#F06292','#A78BFA'];
let S=Object.assign({theme:'dark',accent:'#4C9AFF',txt:'Medium',pv:'1/2',auto:true},JSON.parse(localStorage.getItem('smc.settings')||'{}'));
function applyTheme(){let t=S.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.style.setProperty('--ac',S.accent);document.documentElement.style.fontSize=({Small:'12px',Medium:'13px',Large:'15px'})[S.txt]}
function saveS(){localStorage.setItem('smc.settings',JSON.stringify(S))}
applyTheme();

/* ============ storage (IndexedDB for media) ============ */
let db;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('smc',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbp=(m,f)=>new Promise((res,rej)=>{const tx=db.transaction('media',m),st=tx.objectStore('media'),r=f(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)});

/* ============ project model ============ */
const TRACKS=[['V4','Video 4','v'],['V3','Video 3','v'],['V2','Video 2','v'],['V1','Video 1','v'],['T','Text','t'],['A1','Audio 1','a'],['A2','Audio 2','a']];
const ASP={'16:9':[16,9],'9:16':[9,16],'1:1':[1,1],'4:5':[4,5],'4:3':[4,3],'3:4':[3,4],'21:9':[21,9],'3:2':[3,2],'2:3':[2,3]};
const newP=()=>({name:'Untitled project',aspect:'16:9',clips:[],tr:{}});
let P=newP(),media={},sel=null,T=0,pps=32,playing=false,tab=null,clip=null,hist=[],fut=[],tlH=1;
const clipById=id=>P.clips.find(c=>c.id===id);
const projEnd=()=>Math.max(1,...P.clips.map(c=>c.start+c.dur));
const kindOf=c=>c.kind;
const groupOf=tr=>(TRACKS.find(t=>t[0]===tr)||[])[2];
const compat=(c,tr)=>{const g=groupOf(tr);return c.kind==='audio'?g==='a':c.kind==='text'?g==='t':g==='v'};
function snap(){return JSON.stringify({clips:P.clips,aspect:P.aspect,tr:P.tr})}
function pushH(){hist.push(snap());if(hist.length>60)hist.shift();fut=[]}
function restore(s){const o=JSON.parse(s);P.clips=o.clips;P.aspect=o.aspect;P.tr=o.tr||{};if(sel&&!clipById(sel))sel=null;afterChange(true)}
function undo(){if(!hist.length)return;fut.push(snap());restore(hist.pop())}
function redo(){if(!fut.length)return;hist.push(snap());restore(fut.pop())}
let saveTO;
function persist(){clearTimeout(saveTO);saveTO=setTimeout(()=>{try{localStorage.setItem('smc.project',JSON.stringify(P));$('#sv')&&($('#sv').textContent='Autosaved '+new Date().toTimeString().slice(0,5))}catch(e){}},700)}
function afterChange(full){persist();renderTL();if(full!==false)renderPanel();applyCanvasSize();dirty=true;seekSync();kick()}
function mkClip(o){return Object.assign({id:uid(),track:'V1',kind:'video',media:null,start:0,in:0,dur:3,speed:1,vol:1,fi:0,fo:0,mute:false,props:{opacity:1,scale:1,x:0,y:0,rot:0},kfs:{},color:{b:0,c:0,s:0,e:0},blend:'source-over',text:null},o)}
function freeTrack(kind,start,dur,pref){const list=kind==='audio'?['A1','A2']:kind==='text'?['T']:['V1','V2','V3','V4'];if(pref&&list.includes(pref))list.unshift(pref);for(const t of list){if(!P.clips.some(c=>c.track===t&&c.start<start+dur-1e-3&&c.start+c.dur>start+1e-3))return t}return null}
function addMediaClip(m,at=T){pushH();const kind=m.type;const dur=kind==='image'?5:(isFinite(m.dur)&&m.dur>0?m.dur:5);const tr=freeTrack(kind,at,dur);if(!tr){toast('No free track at the marker. Move the marker or free a track.');hist.pop();return}const c=mkClip({track:tr,kind,media:m.id,start:at,dur});P.clips.push(c);sel=c.id;tab=null;afterChange()}

/* ============ keyframes ============ */
const PROPS=['opacity','scale','x','y','rot'];
function val(c,p,lt){const k=c.kfs[p];if(!k||!k.length)return c.props[p];if(lt<=k[0].t)return k[0].v;for(let i=1;i<k.length;i++)if(lt<=k[i].t){const a=k[i-1],b=k[i];return a.v+(b.v-a.v)*((lt-a.t)/((b.t-a.t)||1))}return k[k.length-1].v}
const ltOf=c=>clamp(T-c.start,0,c.dur);
const hasKf=(c,p,lt)=>(c.kfs[p]||[]).some(k=>Math.abs(k.t-lt)<.04);
function setKf(c,p,lt,v){const a=c.kfs[p]=c.kfs[p]||[];const k=a.find(k=>Math.abs(k.t-lt)<.04);if(k)k.v=v;else{a.push({t:lt,v});a.sort((x,y)=>x.t-y.t)}}
function toggleKf(c,p,lt){const a=c.kfs[p]||[];const i=a.findIndex(k=>Math.abs(k.t-lt)<.04);if(i>=0){a.splice(i,1);if(!a.length)delete c.kfs[p]}else setKf(c,p,lt,val(c,p,lt))}
function setProp(c,p,v){if(c.kfs[p]&&c.kfs[p].length)setKf(c,p,ltOf(c),v);else c.props[p]=v}

/* ============ editing ops ============ */
const selClip=()=>sel?clipById(sel):null;
function needSel(){const c=selClip();if(!c)toast('Tap a clip first');return c}
function inside(c){return T>c.start+.05&&T<c.start+c.dur-.05}
function shiftKfs(c,d){for(const p in c.kfs){const a=c.kfs[p],v0=val(c,p,d);const n=a.filter(k=>k.t>d).map(k=>({t:k.t-d,v:k.v}));n.unshift({t:0,v:v0});c.kfs[p]=n}}
function split(){const c=needSel();if(!c)return;if(!inside(c)){toast('Put the marker inside the clip');return}pushH();const d=T-c.start;const b=JSON.parse(JSON.stringify(c));b.id=uid();b.start=T;b.in=c.in+d*c.speed;b.dur=c.dur-d;shiftKfs(b,d);c.dur=d;if(c.fo){b.fo=c.fo;c.fo=0}b.fi=0;P.clips.push(b);sel=b.id;afterChange()}
function cutLeft(){const c=needSel();if(!c)return;if(!inside(c)){toast('Put the marker inside the clip');return}pushH();const d=T-c.start;shiftKfs(c,d);c.in+=d*c.speed;c.dur-=d;c.start=T;afterChange()}
function cutRight(){const c=needSel();if(!c)return;if(!inside(c)){toast('Put the marker inside the clip');return}pushH();c.dur=T-c.start;afterChange()}
function del(){const c=needSel();if(!c)return;pushH();P.clips=P.clips.filter(x=>x!==c);release(c);sel=null;afterChange()}
let clipb=null;
function copy(){const c=needSel();if(c){clipb=JSON.parse(JSON.stringify(c));toast('Copied')}}
function paste(at=T){if(!clipb){toast('Nothing copied');return}const tr=freeTrack(clipb.kind,at,clipb.dur,clipb.track);if(!tr){toast('No free track there');return}pushH();const c=JSON.parse(JSON.stringify(clipb));c.id=uid();c.track=tr;c.start=at;P.clips.push(c);sel=c.id;afterChange()}
function dup(){const c=needSel();if(!c)return;clipb=JSON.parse(JSON.stringify(c));paste(c.start+c.dur)}
function addText(){pushH();const tr=freeTrack('text',T,3);if(!tr){hist.pop();toast('No free text space there');return}const c=mkClip({track:tr,kind:'text',start:T,dur:3,text:{str:'Your title here',size:64,color:'#ffffff',outline:true}});P.clips.push(c);sel=c.id;tab='Text';afterChange()}
function keyBtn(){const c=needSel();if(!c||c.kind==='audio')return;pushH();const lt=ltOf(c);const any=PROPS.some(p=>hasKf(c,p,lt));PROPS.forEach(p=>{if(any){if(hasKf(c,p,lt))toggleKf(c,p,lt)}else setKf(c,p,lt,val(c,p,lt))});afterChange()}
function speedDlg(){const c=needSel();if(!c||c.kind==='text'||c.kind==='image')return;let v=c.speed;const b=el('div');b.append(chips(['0.25×','0.5×','1×','2×','4×'],({.25:'0.25×',.5:'0.5×',1:'1×',2:'2×',4:'4×'})[c.speed],t=>v=parseFloat(t)));dlg('Clip speed',b,[['Cancel'],['Apply',()=>{pushH();const m=media[c.media];let nd=c.dur*c.speed/v;if(m&&c.in+nd*v>m.dur)nd=(m.dur-c.in)/v;c.dur=Math.max(.2,nd);c.speed=v;afterChange()},1]],360)}

/* ============ media import ============ */

async function envelope(blob){if(blob.size>450e6)throw new Error('big');const ab=await blob.arrayBuffer();const oc=new OfflineAudioContext(1,8000,8000);const buf=await oc.decodeAudioData(ab);const d=buf.getChannelData(0),hop=80,n=Math.floor(d.length/hop),e=new Float32Array(n);for(let i=0;i<n;i++){let s=0;for(let j=0;j<hop;j++)s+=Math.abs(d[i*hop+j]);e[i]=s/hop}

function fft(re,im,inv){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}for(let len=2;len<=n;len<<=1){const a=2*Math.PI/len*(inv?-1:1),wr=Math.cos(a),wi=Math.sin(a),h=len/2;for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<h;j++){const ur=re[i+j],ui=im[i+j],xr=re[i+j+h],xi=im[i+j+h],vr=xr*cr-xi*ci,vi=xr*ci+xi*cr;re[i+j]=ur+vr;im[i+j]=ui+vi;re[i+j+h]=ur-vr;im[i+j+h]=ui-vi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}if(inv)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n}}
function xcorr(cam,ext){const nc=cam.length,ne=ext.length;let N=1;while(N<nc+ne)N<<=1;const ar=new Float64Array(N),ai=new Float64Array(N),br=new Float64Array(N),bi=new Float64Array(N);ext.forEach((v,i)=>ar[i]=v);cam.forEach((v,i)=>br[i]=v);fft(ar,ai,false);fft(br,bi,false);for(let i=0;i<N;i++){const r=ar[i]*br[i]+ai[i]*bi[i],im=ai[i]*br[i]-ar[i]*bi[i];ar[i]=r;ai[i]=im}fft(ar,ai,true);
