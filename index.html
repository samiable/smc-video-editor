<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SMC Video Editor</title>
<style>
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Dancing Script";font-weight:700;src:url(fonts/dancing-script-latin-700-normal.woff2) format("woff2");font-display:swap}
:root{--bg0:#0E0F12;--bg1:#17191d;--bg2:#121316;--bg3:#24272d;--ln:#2a2d33;--ln2:#33373f;--tx:#E6E8EB;--mu:#9AA0A8;--ac:#4C9AFF;--acx:#0B1220;--gr:#2ECC71}
[data-theme=light]{--bg0:#F3F4F6;--bg1:#fff;--bg2:#ECEEF1;--bg3:#EEF0F3;--ln:#DDE0E5;--ln2:#C9CDD4;--tx:#1B1D21;--mu:#5B616B}
[data-theme=black]{--bg0:#000;--bg1:#0a0a0a;--bg2:#050505;--bg3:#161616}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:13px Inter,Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;font-size:12px;color:var(--tx);background:var(--bg3);border:1px solid var(--ln2);border-radius:7px;cursor:pointer;padding:0 10px;height:28px}
button:disabled{opacity:.4}
.pr,.on{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acx)!important;font-weight:700}
.mu{color:var(--mu);font-size:11px}
#top{height:40px;background:var(--bg1);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 8px;flex:none;gap:2px;position:relative}
.logo{display:flex;align-items:center;gap:7px;margin:0 12px 0 6px;font-weight:800;white-space:nowrap}
.logo b{background:var(--ac);color:var(--acx);border-radius:6px;padding:3px 6px;font-size:11px}
.mn{border:0;background:transparent;height:40px;border-radius:0;padding:0 11px}
.menu{position:absolute;top:40px;background:var(--bg1);border:1px solid var(--ln2);border-radius:8px;padding:4px 0;min-width:200px;z-index:50;box-shadow:0 8px 24px #0008}
.menu div{padding:8px 14px;display:flex;justify-content:space-between;gap:20px}
.menu div:active{background:var(--bg3)}
#pname{flex:1;text-align:center;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{border:1px solid var(--ln2);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--mu);white-space:nowrap;margin-left:8px}
#mid{flex:1;min-height:0;display:flex}
#bin{width:var(--binw,210px);background:var(--bg1);flex:none;display:flex;flex-direction:column;min-width:120px}
#bintabs{display:flex;gap:4px;padding:8px 8px 0}#bintabs button{flex:1;height:26px}
#binbody{flex:1;overflow:auto;padding:8px}
.spl{width:6px;flex:none;background:var(--ln);cursor:col-resize;touch-action:none;position:relative}
.spl::after{content:"";position:absolute;left:-8px;right:-8px;top:0;bottom:0}
.spl:hover,.spl.act{background:var(--ac)}
.splh{height:6px;flex:none;background:var(--ln);cursor:row-resize;touch-action:none;position:relative}
.splh::after{content:"";position:absolute;top:-8px;bottom:-8px;left:0;right:0}
.splh:hover,.splh.act{background:var(--ac)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.th{height:54px;border-radius:6px;position:relative;background:var(--bg3) center/cover;overflow:hidden;touch-action:pan-y;border:2px solid transparent}
.th.cur{border-color:var(--ac)}
.th span{position:absolute;right:3px;bottom:2px;font-size:10px;background:#000b;color:#fff;padding:1px 4px;border-radius:3px}
.th i{position:absolute;left:3px;top:2px;font-size:9px;font-style:normal;background:#000b;color:#fff;padding:0 4px;border-radius:3px;max-width:90%;overflow:hidden;white-space:nowrap}
.ghost{position:fixed;z-index:300;pointer-events:none;padding:6px 10px;background:var(--ac);color:var(--acx);border-radius:8px;font-weight:700;font-size:12px;opacity:.92}
#center{flex:1;min-width:200px;display:flex;flex-direction:column;align-items:center;padding:8px 8px 0;gap:8px}
#pvwrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;position:relative}
#cv{width:100%;height:100%;object-fit:contain;border-radius:6px;background:#000}
#srcbadge{position:absolute;left:10px;top:8px;background:#000b;color:#fff;padding:3px 9px;border-radius:6px;font-size:11px;display:none}
#ctl{width:100%;display:flex;align-items:center;justify-content:space-between;height:34px;flex:none;gap:8px;flex-wrap:nowrap}
.sg{display:flex;border:1px solid var(--ln2);border-radius:7px;overflow:hidden}
.sg button{border:0;border-radius:0;background:transparent;height:24px;padding:0 8px}
#panel{width:var(--panw,300px);background:var(--bg1);padding:10px 12px;overflow:auto;flex:none;min-width:200px}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button{flex:1;padding:0;height:26px;font-size:11px}
.sl{margin-bottom:11px}.sh{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px;min-height:18px;gap:6px}
.sv{display:flex;align-items:center;gap:6px}
input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--ac)}
.dm{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--mu);margin:0 2px;padding:0;border-radius:2px;background:transparent;flex:none}
.dm.on{background:#FFD166!important;border-color:#FFD166!important}
.ch{display:flex;flex-wrap:wrap;gap:4px}.ch button{height:24px;padding:0 8px;font-size:11px}
select,textarea,input[type=text],input[type=number]{background:var(--bg2);color:var(--tx);border:1px solid var(--ln2);border-radius:7px;padding:5px 8px;font:inherit;font-size:12px}
.sec{font-weight:700;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sec:first-child{margin-top:0}
#tbar{height:34px;background:var(--bg1);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:center;gap:2px;flex:none;overflow-x:auto}
#tbar button{display:flex;align-items:center;gap:4px;height:26px;padding:0 7px;font-size:11px;white-space:nowrap}
.sep{width:1px;height:18px;background:var(--ln2);margin:0 3px;flex:none}
#tl{height:var(--tlh,340px);background:var(--bg2);display:flex;flex-direction:column;flex:none;min-height:130px}
#tlh{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--ln);flex:none;gap:8px}
#tlb{flex:1;overflow:auto;position:relative}
#tlc{position:relative;min-height:100%}
.tr{display:flex;position:relative}
.lb{width:104px;flex:none;position:sticky;left:0;z-index:6;background:var(--bg2);font-size:11px;color:var(--mu);display:flex;align-items:center;gap:4px;padding-left:8px;border-bottom:1px solid var(--ln)}
.lb button{border:0;background:transparent;padding:0;height:16px;width:14px;color:var(--mu)}
.lb button.s{color:#FFD166}
.row{position:relative;background:var(--bg1);border-bottom:1px solid var(--ln);touch-action:pan-x pan-y}
.row.hov{background:#4C9AFF33}
.nz{display:none;height:22px;align-items:center;justify-content:center;border:1px dashed var(--ln2);color:var(--mu);font-size:11px;margin:2px 0}
.nz.hov{background:#4C9AFF33;border-color:var(--ac)}
body.dragging .nz{display:flex}
.rul{height:22px;background:var(--bg2);touch-action:none;position:relative}
.rul i{position:absolute;top:5px;font-size:10px;font-style:normal;color:var(--mu);border-left:1px solid var(--ln2);padding-left:4px;height:14px}
.c{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:10px;padding:4px 6px;color:#fff;overflow:hidden;white-space:nowrap;touch-action:none}
.c.sel{outline:2px solid #fff;outline-offset:-2px}
.k-v{background:#3A5F8F}.k-v2{background:#6A4C93}.k-t{background:#8A6A12}.k-a{background:#2E7D5B}.k-adj{background:repeating-linear-gradient(45deg,#8a3d6a,#8a3d6a 8px,#7a345d 8px,#7a345d 16px)}
.h{position:absolute;top:0;bottom:0;width:14px;touch-action:none}.h.l{left:0}.h.r{right:0}
.h::after{content:"";position:absolute;top:30%;bottom:30%;width:3px;border-radius:2px;background:#fff9}.h.l::after{left:3px}.h.r::after{right:3px}
.kfd{position:absolute;width:8px;height:8px;background:#FFD166;transform:rotate(45deg);top:50%;margin-top:-4px;pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#FF8A3D;z-index:5;pointer-events:none}
#ph::before{content:"";position:absolute;left:-5px;top:0;width:12px;height:14px;background:#FF8A3D;border-radius:2px}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:#000b;z-index:100;display:flex;align-items:center;justify-content:center}
.card{background:var(--bg1);border:1px solid var(--ln2);border-radius:12px;padding:16px 18px;max-width:96vw;max-height:94vh;display:flex;flex-direction:column}
.ct{font-size:15px;font-weight:700;margin-bottom:12px}.cb{flex:1;overflow:auto}
.cf{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.cf button{height:30px;padding:0 16px}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tg{width:32px;height:18px;border-radius:9px;background:var(--ln2);position:relative;flex:none;padding:0;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:6px;background:#fff}
.tg.on{background:var(--ac)!important}.tg.on::after{left:17px}
.bar{height:8px;background:var(--ln2);border-radius:4px;overflow:hidden}.bar div{height:8px;background:var(--ac)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--ln2);padding:9px 16px;border-radius:9px;z-index:400;display:none;max-width:80vw}
.ctx{position:fixed;background:var(--bg1);border:1px solid var(--ln2);border-radius:8px;padding:4px 0;z-index:250;box-shadow:0 8px 24px #0008}
.ctx div{padding:9px 16px}.ctx div:active{background:var(--bg3)}
.fxg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fxg button{height:34px;text-align:left;padding:0 10px}
.wheel{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,#777 0,#7770 62%),conic-gradient(#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33);position:relative;touch-action:none;margin:0 auto}
.wheel i{position:absolute;width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid #000;margin:-6px 0 0 -6px;pointer-events:none}
#home{position:fixed;left:0;top:0;right:0;bottom:0;z-index:90;overflow:auto;background:radial-gradient(1000px 500px at 12% -10%,#0f4d2b55,transparent),radial-gradient(900px 500px at 100% 110%,#0f4d2b44,transparent),var(--bg0);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0}
.hh{display:flex;align-items:center;justify-content:space-between;padding:14px 28px}
.hh img{width:44px;height:44px;border-radius:11px}
.wel{padding:34px 28px 10px;max-width:1100px}
.w1{font:700 56px/1.1 "Dancing Script","Brush Script MT",cursive;color:var(--gr)}
.w1 span{color:#fff}
.w2{font:800 34px/1.25 Poppins,Roboto,Arial,sans-serif;color:#fff;margin-top:6px;letter-spacing:.2px}
.w2 b{color:var(--gr);font-weight:800}
[data-theme=light] .w1 span,[data-theme=light] .w2{color:#14301f}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:22px 28px 40px}
.pc{background:var(--bg1);border:1px solid var(--ln);border-radius:14px;overflow:hidden;position:relative;cursor:pointer}
.pc .pt{height:128px;background:linear-gradient(135deg,#0f3d24,#0b0f0d) center/cover;display:flex;align-items:center;justify-content:center;font:800 40px Poppins,Arial,sans-serif;color:#2ECC7155}
.pc .pi{padding:10px 12px}
.pc.new{border:2px dashed var(--gr);background:#2ECC7110;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:196px;color:var(--gr);font:800 16px Poppins,Arial,sans-serif;gap:8px}
.pc .mm{position:absolute;right:8px;top:8px;width:30px;padding:0;background:#000a;color:#fff;border:0}
.srbox{position:relative;margin:0 8px;flex:none}.srbox input{width:250px;height:28px;padding:0 10px 0 30px;border-radius:14px}
.srbox svg{position:absolute;left:9px;top:7px;color:var(--mu);pointer-events:none}
.srdrop{position:fixed;width:460px;max-width:96vw;max-height:74vh;overflow:auto;background:var(--bg1);border:1px solid var(--ln2);border-radius:12px;z-index:260;box-shadow:0 12px 32px #000a;padding:6px 0}
.srcat{padding:8px 14px 4px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ac)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;cursor:pointer}
.sr:hover,.sr.act{background:var(--bg3)}.sr b{font-weight:600}.sr .mu{max-width:210px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sr button{height:22px;padding:0 8px;font-size:11px}
.srsug{padding:10px 14px;color:var(--mu);line-height:1.7}.srsug span{display:inline-block;border:1px solid var(--ln2);border-radius:12px;padding:1px 9px;margin:2px 4px 2px 0;color:var(--tx);cursor:pointer}
.hs{padding:0 28px;max-width:520px}.hs input{width:100%;height:38px;border-radius:19px;padding:0 16px 0 40px;font-size:14px}.hsw{position:relative}.hsw svg{position:absolute;left:14px;top:11px;color:var(--mu)}
</style>
</head>
<body>
<div id="home"></div>
<div id="app" style="display:none">
<div id="top"></div>
<div id="mid">
 <div id="bin"><div id="bintabs"></div><div id="binbody"></div></div>
 <div class="spl" id="sp1"></div>
 <div id="center"><div id="pvwrap"><canvas id="cv" width="640" height="360"></canvas><div id="srcbadge"></div></div><div id="ctl"></div></div>
 <div class="spl" id="sp2"></div>
 <div id="panel"></div>
</div>
<div class="splh" id="sp3"></div>
<div id="tbar"></div>
<div id="tl"><div id="tlh"></div><div id="tlb"><div id="tlc"></div></div></div>
</div>
<div id="toast"></div>
<input type="file" id="fin" multiple accept="video/*,audio/*,image/*" style="display:none">
<input type="file" id="fdir" webkitdirectory multiple style="display:none">
<input type="file" id="flut" accept=".cube" style="display:none">
<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmtT=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60),f=Math.floor((t%1)*30);return[m,s,f].map(n=>String(n).padStart(2,'0')).join(':')};
const ico=(d,s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const IC={undo:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',redo:'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',copy:'M8 8h12v12H8zM4 16V4h12',paste:'M9 4h6v3H9zM7 6H5v15h8M11 10h9v11h-9z',split:'M12 3v18M7 8l-3 4 3 4M17 8l3 4-3 4',cl:'M12 3v18M8 7l-5 5 5 5',cr:'M12 3v18M16 7l5 5-5 5',key:'M12 3l7 9-7 9-7-9z',spd:'M12 14l5-5M4 18a9 9 0 1116 0',txt:'M5 6V4h14v2M12 4v16M9 20h6',del:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',dup:'M8 8h12v12H8zM4 16V4h12',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6',lock:'M6 11h12v9H6zM9 11V8a3 3 0 016 0v3',spk:'M4 9v6h4l5 4V5L8 9z',play:'M7 4l13 8-13 8z',pause:'M7 4v16M17 4v16',prev:'M19 5l-9 7 9 7zM5 5v14',next:'M5 5l9 7-9 7zM19 5v14',gear:'M12 9a3 3 0 100 6 3 3 0 000-6M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',grip:'M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4',home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',folder:'M3 6h6l2 2h10v11H3z',plus:'M12 5v14M5 12h14',adj:'M4 6h16M4 12h16M4 18h16M9 4v4M15 10v4M8 16v4',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5'};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200)}
function dlg(title,body,btns,w=520){const o=el('div','ov'),c=el('div','card');c.style.width=w+'px';const cb=el('div','cb');cb.append(body);c.append(el('div','ct',title),cb);const f=el('div','cf');btns.forEach(([t,fn,pr])=>{const b=el('button',pr?'pr':'',t);b.onclick=()=>{if(fn&&fn()===false)return;o.remove()};f.append(b)});c.append(f);o.append(c);document.body.append(o);return o}
function chips(items,cur,fn){const d=el('div','ch');items.forEach(t=>{const b=el('button',t===cur?'on':'',t);b.onclick=()=>{d.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(t)};d.append(b)});return d}
function toggle(on,fn){const b=el('button','tg'+(on?' on':''));b.onclick=()=>{b.classList.toggle('on');fn(b.classList.contains('on'))};return b}
const ap=(p,...c)=>{c.forEach(x=>p.append(x));return c[c.length-1]};
function row(l,r){const d=el('div','dr');d.append(el('span','',l));if(r)d.append(r);return d}

/* ============ settings & theme ============ */
const ACC=['#4C9AFF','#2EC4B6','#2ECC71','#FF8A3D','#F06292','#A78BFA'];
let S=Object.assign({theme:'dark',accent:'#4C9AFF',txt:'Medium',pv:'1/2',auto:true,binw:210,panw:300,tlh:340,snap:true,snapTo:{ph:true,edges:true,zero:true},snapPx:10,guide:true,magnet:false,magnetAll:false},JSON.parse(localStorage.getItem('smc.settings')||'{}'));
function applyTheme(){let t=S.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';const r=document.documentElement;r.dataset.theme=t;r.style.setProperty('--ac',S.accent);r.style.fontSize=({Small:'12px',Medium:'13px',Large:'15px'})[S.txt];r.style.setProperty('--binw',S.binw+'px');r.style.setProperty('--panw',S.panw+'px');r.style.setProperty('--tlh',S.tlh+'px')}
function saveS(){localStorage.setItem('smc.settings',JSON.stringify(S))}
applyTheme();

/* ============ storage (IndexedDB for media and LUTs) ============ */
let db;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('smc',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbp=(m,f)=>new Promise((res,rej)=>{const tx=db.transaction('media',m),st=tx.objectStore('media'),r=f(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)});

/* ============ constants ============ */
const AR=[['16:9',16,9],['9:16',9,16],['1:1',1,1],['4:5',4,5],['4:3',4,3],['3:4',3,4],['21:9',21,9],['3:2',3,2],['2:3',2,3],['2:1',2,1],['1.85:1',1.85,1],['2.35:1',2.35,1],['2.39:1',2.39,1],['1.43:1',1.43,1],['5:4',5,4],['16:10',16,10],['18:9',18,9],['9:18',9,18]];
